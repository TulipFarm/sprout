<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meadow pricing</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #18181b;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: #52525b;
        font-size: 13px;
      }
      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      li {
        padding: 14px;
        border: 1px solid #e4e4e7;
        border-radius: 10px;
        background: #fff;
        font-size: 13px;
      }
      strong {
        display: block;
        margin-bottom: 4px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Meadow pricing</h1>
    <p>Sample page loaded inside a sandboxed canvas frame.</p>
    <ul>
      <li><strong>$0</strong>Starter · 1 garden</li>
      <li><strong>$12</strong>Grower · 5 gardens</li>
      <li><strong>$40</strong>Farm · Unlimited</li>
    </ul>
  </body>
</html>
