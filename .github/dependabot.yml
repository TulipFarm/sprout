# Minor and patch updates arrive as one grouped PR per ecosystem and merge
# themselves once CI passes (see dependabot-auto-merge.yml). Major updates
# get their own PRs so one breaking upgrade can't hold the rest back.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the peer range of @astrojs/react and @vitejs/plugin-react;
      # bump it together with them by hand.
      - dependency-name: oxc-transform-react
      # Stays on 6: the component board needs its stable JS compiler API.
      - dependency-name: typescript-6
        update-types: [version-update:semver-major]
      # 3.11 adds ~23 kB gzip to the chart entries (past the 10% size gate) and
      # inlines text fill styles that override Sprout's chart CSS. Upgrade by
      # hand once the charts move to RechartsThemeProvider.
      - dependency-name: recharts
        versions: ['>= 3.11.0']
      # babel-plugin-react-compiler (component stats) is built on Babel 7's AST
      # and bails out of most components under Babel 8.
      - dependency-name: '@babel/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
