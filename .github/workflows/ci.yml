name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .vitest/coverage
      - if: always() && github.event_name == 'pull_request'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -w CI -b main -e push -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" -n coverage -D coverage-main; then
            echo "path=coverage-main/coverage-summary.json" >> "$GITHUB_OUTPUT"
          fi
      - if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: .vitest/coverage/coverage-summary.json
          json-summary-compare-path: ${{ steps.baseline.outputs.path }}
          file-coverage-mode: none
      - run: pnpm test:board
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:install
